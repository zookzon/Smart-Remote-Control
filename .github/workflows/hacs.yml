name: HACS Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration
          # GitHub Licensee currently reports PolyForm Noncommercial 1.0.0 as
          # SPDX: NOASSERTION. Keep the project's chosen license and skip only
          # HACS's repository-license identification check.
          ignore: license
